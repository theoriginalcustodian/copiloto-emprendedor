<!doctype html><meta charset="utf-8">
<style>
 body{background:#F7F3EC;font-family:Inter,system-ui;padding:40px;color:#1A1512}
 h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5C534C;margin:26px 0 12px}
 .f{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
 .m{text-align:center}
 .m small{display:block;font-size:10px;color:#5C534C;margin-top:8px;font-family:ui-monospace,Menlo}
 .tile{width:42px;height:42px;border-radius:14px;background:#E4DCEC;display:flex;
       align-items:center;justify-content:center;color:#1A1512}
 .fila{display:flex;gap:14px;align-items:center;background:#fff;border-radius:22px;
       padding:14px 16px;box-shadow:0 4px 18px rgba(26,21,18,.07);width:330px}
 .fila b{display:block;font-size:15px;font-weight:500}
 .fila span{display:block;font-size:12px;color:#A32B47;font-weight:600;margin-top:5px}
</style>
<h3>Tamaños · A real de Roboto</h3>
<div class="f" id="a1"></div>
<h3>Con los puntos del logo (para >34 px)</h3>
<div class="f" id="a2"></div>
<h3>En su tile, junto a íconos Phosphor</h3>
<div class="f" id="a3"></div>
<h3>En la fila real</h3>
<div class="f" id="a4"></div>

const doc='<path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Z"/>';
document.getElementById('a3').innerHTML=[[T,'arca (Roboto)'],[S,'con puntos'],[recibo,'phosphor receipt'],[doc,'phosphor file']]
  .map(([d,n])=>`<span class="m"><span class="tile">${svg(d,18)}</span><small>${n}</small></span>`).join('');
document.getElementById('a4').innerHTML=[[T,'Certificado ARCA','Vence en 12 días'],[doc,'Factura Rodríguez SRL','22 días impaga']].map(([d,t1,t2])=>
