name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Sin esto, un run que se pierde (outage de Actions, race, rama con historia rara) queda sin
  # medir PARA SIEMPRE: no hay forma de pedir una corrida a demanda, sólo de esperar un evento.
  # Medido durante el outage del 2026-08-06: `gh run rerun` sobre un run `queued` lo deja en un
  # limbo incancelable; `close`+`reopen` no dispara (GitHub deduplica por SHA); un commit vacío
  # tampoco. `workflow_dispatch` es la única forma real de re-pedir la corrida:
  #   gh workflow run tests.yml --ref <rama-o-sha>
  workflow_dispatch:

# G-2 del frente de manejo de errores. Lo que este CI corrige (medido el 2026-07-28):
#
#   - backend corría una LISTA HARDCODEADA de 11 archivos sobre los 108 que existen. Un test nuevo
#     nacía fuera del CI salvo que alguien se acordara de agregarlo a la lista — y nadie se acuerda.
#     Así fue como `test_errores_web.py`, que es el guard de los códigos de error, nunca corrió.
#   - frontend hacía SOLO `npm run build`: 0 de 155 archivos de test de TS, y ningún `tsc --noEmit`.
#
# Por eso el criterio ahora es "TODO lo que exista", nunca una lista: una lista se desactualiza en
# silencio y sigue dando verde. En ARCA, 1 de cada 3 fixes de error-handling declarados resultó falso
# (`2026-04-19_AUDITORIA:26-29`); sin este gate, el mismo plan que lo arregla se degrada igual.
#
# Los tests que necesitan Postgres o credenciales reales se auto-saltean (`skip`, no `fail`), y eso es
# correcto: este CI protege imports, mount y lógica pura; lo live se ejercita en el VPS al desplegar.

jobs:
  backend:
    runs-on: ubuntu-latest

    # ⚠️ Postgres EFÍMERO — el hallazgo más caro de este frente (2026-07-28).
    #
    # 100 de los 135 tests que se saltaban lo hacían por `skipif(not os.environ.get("DATABASE_URL"))`,
    # en 15 archivos. Entre ellos, `test_adversarial_multitenant.py` y `test_context_factory.py`: el
    # aislamiento cross-tenant —el control de seguridad más crítico del repo, que un ADR declara
    # verificado— **no corría en ningún entorno automático**. Sólo a mano, y la única URL disponible
    # era la de PRODUCCIÓN, que es exactamente el incidente que el repo ya vivió
    # (`copiloto-tests-ensuciaban-la-base`).
    #
    # Un contenedor descartable rompe el dilema: los tests corren en cada PR, contra una base real
    # (no un mock, que reproduciría el mismo comportamiento equivocado que se quiere cazar), y se
    # destruye al terminar. Cero riesgo sobre datos vivos.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copiloto
          POSTGRES_PASSWORD: copiloto
          POSTGRES_DB: copiloto_test
        ports:
          - 5432:5432
        # Sin healthcheck, los tests arrancan antes de que Postgres acepte conexiones y fallan por
        # una carrera, no por un bug — el peor tipo de rojo: el que enseña a re-correr el CI.
        options: >-
          --health-cmd "pg_isready -U copiloto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # ⚠️ El usuario es `copiloto_app`, NO el `copiloto` del contenedor. El de la imagen es
      # **superuser**, y un superuser saltea RLS **incluso con FORCE**: corriendo con él, todo test de
      # aislamiento pasa aunque el aislamiento no exista — el CI confirmaría en vez de verificar
      # (2026-07-31, el rojo que destapó esto). `copiloto_app` replica al rol de producción: dueño de
      # sus tablas, NO superuser, NO BYPASSRLS.
      DATABASE_URL: postgresql://copiloto_app:copiloto@localhost:5432/copiloto_test
      # Con FORCE activo, como quedará producción tras la migración. El CI ejercita el estado FINAL.
      UC_RLS_FORCE: "1"
      PGPASSWORD: copiloto

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install -r requirements.txt
      # El provisionado activa RLS con una policy que llama `auth.jwt()` y otorga permisos a
      # `anon`/`authenticated`/`service_role`: nada de eso es Postgres, es **Supabase**. En el VPS lo
      # trae la instancia de Supabase; en un Postgres pelado hay que crearlo. Sin esto el provisionado
      # muere con `schema "auth" does not exist` — y ese es el motivo real de que el runbook de
      # "levantar el copiloto en un entorno nuevo" nunca se hubiera podido ejecutar.
      # El rol con el que corren los tests. Se crea con el superuser del contenedor y a partir de ahí
      # NO se lo vuelve a usar: si los tests corrieran como superuser, el RLS no los alcanzaría y el
      # job daría verde sobre un aislamiento inexistente.
      - name: rol de aplicación NO-superuser (replica producción)
        run: |
          psql "postgresql://copiloto:copiloto@localhost:5432/copiloto_test" -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN
               IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='copiloto_app') THEN
                 CREATE ROLE copiloto_app LOGIN PASSWORD 'copiloto' NOSUPERUSER NOBYPASSRLS;
               END IF;
             END \$\$;"
          psql "postgresql://copiloto:copiloto@localhost:5432/copiloto_test" -v ON_ERROR_STOP=1 -c \
            "GRANT ALL ON DATABASE copiloto_test TO copiloto_app;"
      - name: compatibilidad Supabase (roles + auth.jwt) — sólo para la base efímera
        run: |
          psql "postgresql://copiloto:copiloto@localhost:5432/copiloto_test" -v ON_ERROR_STOP=1 \
            -f deploy/worker/bootstrap-supabase-compat.sql
          # El schema lo crea el superuser y se lo cede al rol de la app: `provision.py` corre como
          # `copiloto_app` y necesita ser DUEÑO de sus tablas (igual que en producción), no sólo tener
          # permiso de escritura.
          psql "postgresql://copiloto:copiloto@localhost:5432/copiloto_test" -v ON_ERROR_STOP=1 -c \
            "CREATE SCHEMA IF NOT EXISTS uc_factory AUTHORIZATION copiloto_app;
             GRANT ALL ON SCHEMA uc_factory TO copiloto_app;
             -- El schema \`auth\` lo crea el bootstrap de compatibilidad y pertenece al superuser;
             -- el provisionado lo necesita (la policy legacy referencia \`auth.jwt()\`). En Supabase
             -- real estos permisos vienen dados: acá hay que otorgarlos explícitamente.
             GRANT USAGE ON SCHEMA auth TO copiloto_app;
             GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA auth TO copiloto_app;"
      # Provisiona + corre (collect y suite completa) -- la definición vive en scripts/ci/backend.sh,
      # el mismo script que invoca `sync-test-backend.sh` en el VPS (ADR-001). Sin lista de archivos:
      # todo lo que exista corre.
      - run: bash scripts/ci/backend.sh

  # Los 5 jobs NO definen su suite acá: invocan `scripts/ci/<job>.sh`, que es la
  # definición ÚNICA (ADR-001). El porqué de cada paso —incluido que `apps/copiloto-web` no está en
  # los `workspaces` del root y se instala aparte— vive en el comentario de cada script. Así lo que
  # corre GitHub y lo que corre una sesión en su máquina son literalmente el mismo comando: mientras
  # Actions esté caído, el gate local no es una aproximación al CI, es el CI.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/ci/core.sh

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/ci/mobile.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/ci/web.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/ci/lint.sh

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Primero el CONTROL POSITIVO: un guard que nunca vio un rojo no esta verificado.
      # Su rotura se ve identica a su funcionamiento (silencio en ambos casos), asi que el
      # verde del paso siguiente solo vale si antes probamos que sabe ponerse rojo.
      - name: control positivo -- el guard sabe detectar
        run: bash scripts/ci/no-drift.sh --self-test
      - name: la suite se define en scripts/ci, no dentro de este archivo (ADR-001)
        run: bash scripts/ci/no-drift.sh
