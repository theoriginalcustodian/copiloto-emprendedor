<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 24">
  <!--
    Lockup horizontal — símbolo (isotipo-odobi, viewBox nativo 0-24) + wordmark "Odobi" en
    NeueEinstellung Bold. Medido con getBBox() real en navegador, no estimado:
      símbolo:  x:[2.497,21.376] y:[3.5,20.5]  (18.879 x 17, sin trazo)
      wordmark: 37.87 x 16.87 a font-size=13.5 (undershoot de ~3.5u bajo la línea de base,
                normal en "o/d/b" redondas — por eso el baseline NO coincide con el borde
                inferior del símbolo, ver isotipo-odobi-resguardo-y-minimo.md).
    Separación símbolo→wordmark = 5.66 u = 0.3 x ancho del símbolo (unidad del propio glifo).
  -->
  <g fill="none" stroke="#1A1512" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
    <path d="M11 3.5a8.5 8.5 0 1 0 0 17"/>
    <path d="M11 7.5a4.5 4.5 0 1 0 0 9"/>
    <path d="M16.5 8.8a4.8 4.8 0 0 1 0 6.4"/>
    <path d="M19.5 6.5a9 9 0 0 1 0 11"/>
  </g>
  <text x="29.66" y="16.95" font-family="'NeueEinstellung', Inter, ui-sans-serif, system-ui, sans-serif"
        font-weight="700" font-size="13.5" letter-spacing="-0.01em" fill="#1A1512">Odobi</text>
</svg>
