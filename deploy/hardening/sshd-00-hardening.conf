# Hardening SSH (auditoría 2026-11-04, SEC-A1-2). Gana sobre sshd_config por orden de Include (primero-gana).
# AllowTcpForwarding queda en yes: el usuario kaggle-tunnel lo necesita (túnel solo-llave).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
