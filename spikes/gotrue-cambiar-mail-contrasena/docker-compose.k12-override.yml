# Override del spike K-12: agrega mailpit (captura SMTP) y las 2 vars de GoTrue que el compose de prod no expone.
services:
  auth:
    environment:
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: ${K12_REAUTH:-false}
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: ${K12_SECURE_EMAIL_CHANGE:-true}
      GOTRUE_PASSWORD_MIN_LENGTH: ${K12_PW_MIN:-6}
    depends_on:
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.21
    networks: [authnet]
    ports:
      - "127.0.0.1:${K12_MAIL_PORT:-8971}:8025"
